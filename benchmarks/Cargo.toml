[package]
name = "datafusion-benchmarks"
description = "DataFusion Benchmarks"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[features]
ci = []

# Core DataFusion features required for all benchmarks
core = [
    "datafusion/sql",
    "datafusion/parquet",
    "datafusion/compression",
    "datafusion/nested_expressions",
    "datafusion/crypto_expressions",
    "datafusion/datetime_expressions",
    "datafusion/encoding_expressions",
    "datafusion/regex_expressions",
    "datafusion/string_expressions",
    "datafusion/unicode_expressions",
    "datafusion/recursive_protection",
    "datafusion-common/sql",
    "datafusion-common/parquet",
    "parquet/arrow",
    "parquet/async",
    "parquet/flate2",
    "parquet/lz4",
    "parquet/snap",
    "parquet/zstd",
]

default = ["mimalloc", "suite-tpch"]
mimalloc_extended = ["libmimalloc-sys/extended"]
snmalloc = ["snmalloc-rs"]

# Suite-specific features - all depend on core for DataFusion features
suite-cancellation = ["core"]
suite-clickbench = ["core"]
suite-h2o = ["core"]
suite-imdb = ["core"]
suite-joins = ["core"]
suite-tpch = ["core"]

full = [
    "suite-cancellation",
    "suite-clickbench",
    "suite-h2o",
    "suite-imdb",
    "suite-joins",
    "suite-tpch",
]

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true, default-features = false }
datafusion-common = { workspace = true, default-features = false }
env_logger = { workspace = true }
futures = { workspace = true }
libmimalloc-sys = { version = "0.1", optional = true }
log = { workspace = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
object_store = { workspace = true }
parquet = { workspace = true, default-features = false }
rand = { workspace = true }
regex.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
snmalloc-rs = { version = "0.3", optional = true }
structopt = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot"] }
tokio-util = { version = "0.7.17" }

[dev-dependencies]
datafusion-proto = { workspace = true }

[[bin]]
name = "dfbench"
path = "src/bin/dfbench.rs"
required-features = ["full"]

[[bin]]
name = "clickbench"
path = "src/bin/clickbench.rs"
required-features = ["suite-clickbench"]

[[bin]]
name = "external_aggr"
path = "src/bin/external_aggr.rs"
required-features = ["suite-tpch"]

[[bin]]
name = "imdb"
path = "src/bin/imdb.rs"
required-features = ["suite-imdb"]

[[bin]]
name = "mem_profile"
path = "src/bin/mem_profile.rs"
required-features = ["full"]

[[bin]]
name = "tpch"
path = "src/bin/tpch.rs"
required-features = ["suite-tpch"]
